    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=DM+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />

      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=DM+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
